[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "street-morphotypes"
version = "0.1.0"
description = "Street segment morphotype classification from OpenStreetMap: space syntax + urban context, two parallel clusterings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anastasiia Erokhina" }]
dependencies = [
    "osmnx>=2.0",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "python-igraph>=0.11",
    "scipy>=1.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
street-morphotypes = "street_morphotypes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
street_morphotypes = ["defaults.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
