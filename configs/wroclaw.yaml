# Wrocław, Poland — whole city (administrative boundary from OSM).
area:
  name: wroclaw
  mode: place
  place: "Wrocław, Lower Silesian Voivodeship, Poland"
  network_buffer_m: 2000

metrics:
  maxspeed:
    # Polish defaults (km/h): 50 in built-up areas, expressways and motorways faster.
    defaults_by_highway:
      motorway: 140
      trunk: 100
      primary: 50
      secondary: 50
      tertiary: 50
      unclassified: 50
      residential: 50
      living_street: 20
      motorway_link: 50
      trunk_link: 50
      primary_link: 50
      secondary_link: 50
      tertiary_link: 50

# Names of the classes, written after reading their profiles (outputs/wroclaw/morphotypes.xlsx).
# They belong to this run: with another k or new data, check the profiles and rename.
names:
  transport:
    1: Local access street
    2: Ordinary street
    3: Public transport street with stops
    4: Public transport arterial
  context:
    1: Dense residential street, little greenery
    2: Green residential street
    3: Institutional street (schools, health, campuses)
    4: Commercial street
