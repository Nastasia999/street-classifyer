# Irkutsk, Russia — whole city (administrative boundary from OSM).
area:
  name: irkutsk
  mode: place
  place: "Irkutsk, Irkutsk Oblast, Russia"
  network_buffer_m: 2000

# k is fixed, not chosen by the silhouette: in Irkutsk the silhouette does not
# separate k = 2 from k = 4 beyond its bootstrap noise (transport: -0.009 +- 0.017;
# context: -0.05 +- 0.05), while the two-class context partition is unstable
# (ARI down to 0.12 across subsamples). k = 4 in both blocks is the more stable
# choice and matches Wroclaw. Evidence: scripts/k_selection.py -> docs/k_selection/.
clustering:
  transport: {k: 4}
  context: {k: 4}

# Names of the classes, written after reading their profiles (outputs/irkutsk/morphotypes.xlsx).
# They belong to this run: with another k or new data, check the profiles and rename.
names:
  transport:
    1: Local access street
    2: Ordinary street
    3: Public transport street with stops
    4: Public transport arterial
  context:
    1: Residential street without services
    2: Green street with sparse buildings
    3: Institutional street (schools, health, campuses)
    4: Commercial street
